[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-agent"
version = "0.6.0"
description = "An ecommerce business assistant with auditable AI workflows."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "fastapi>=0.115.6,<1.0",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "uvicorn>=0.34,<1.0",
    "sqlalchemy[asyncio]>=2.0.54,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "PyJWT>=2.10,<3",
    "argon2-cffi>=23.1,<26",
    "redis>=6,<9",
    "python-multipart>=0.0.20,<0.1",
    "pypdf>=6.13.3,<7",
    "python-docx>=1.2,<2",
    "rank-bm25==0.2.2",
    "fastembed==0.8.0",
    "onnxruntime==1.23.2",
    "chromadb-client==1.5.9",
    "httpx>=0.28,<1.0",
    "langgraph==1.2.14",
    "langgraph-checkpoint==4.2.0",
    "langgraph-checkpoint-postgres==3.1.2",
    "mcp==1.30.0",
    "sqlglot==30.22.0",
    "tzdata>=2025.1,<2027",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.11,<1.0",
    "pip-tools>=7.5,<8",
    "setuptools>=77,<83",
]

[project.scripts]
enterprise-agent = "enterprise_agent.cli:main"
enterprise-agent-mcp = "enterprise_agent.mcp.server:main"
enterprise-agent-mcp-client = "enterprise_agent.mcp.client:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: in-process HTTP integration and future real database integration",
    "live: explicitly authorized external model or service calls",
    "postgres: requires a dedicated real PostgreSQL test database",
    "rag: requires prepared local models and a real Chroma HTTP server",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
