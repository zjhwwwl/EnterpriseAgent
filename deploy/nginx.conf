worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_max_body_size 9m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    upstream enterprise_api {
        zone enterprise_api 64k;
        server api:8000 resolve;
        keepalive 16;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://enterprise_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 320s;
            proxy_send_timeout 30s;
        }
        location /health/ {
            proxy_pass http://enterprise_api;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }
        location /assets/ {
            try_files $uri =404;
            expires 1d;
            add_header Cache-Control "public";
        }
        location / {
            # Load the current application entry on reload after a web release.
            # Fingerprinted bundles keep their separate /assets/ cache policy.
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
